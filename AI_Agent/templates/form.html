<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Agent Form Assistant</title>
  <style>
    /* Global Styles */
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #333;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 5px;
      color: #003950;
    }

    p.subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 20px;
    }

    .ai-banner {
      background: #e0f7f9;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 1rem;
      margin-bottom: 25px;
      color: #034f57;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      font-size: 0.95rem;
    }

    .file-input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fafafa;
    }

    .preview-image {
      margin-top: 10px;
      max-width: 100%;
      border-radius: 6px;
      border: 1px solid #ddd;
      display: none;
    }

    .submit-btn {
      background: #03002b;
      color: #fff;
      padding: 14px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #100043;
    }

    #result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      display: none;
    }

    .success {
      background: #dff0d8;
      color: #3c763d;
      border: 1px solid #d6e9c6;
      display: block;
    }

    .error {
      background: #f2dede;
      color: #a94442;
      border: 1px solid #ebccd1;
      display: block;
    }

    #progressContainer {
      margin: 20px 0;
      display: none;
    }

    #progressContainer div {
      background: #f0f0f0;
      border-radius: 6px;
      overflow: hidden;
    }

    #progressBar {
      background: #015103;
      height: 16px;
      width: 0%;
      transition: width 0.3s;
    }

    #progressMessage {
      text-align: center;
      margin-top: 8px;
      font-size: 0.9rem;
      color: #555;
    }

    iframe {
      display: none;
      width: 100%;
      height: 400px;
      border: none;
      margin-top: 15px;
      border-radius: 6px;
    }

    /* Mobile enhancements */
    @media (max-width: 480px) {
      body { background: #fafafa; }
      .container { padding: 16px; }
      h1 { font-size: 1.4rem; }
      p.subtitle { font-size: 0.9rem; }
      .ai-banner { font-size: 0.95rem; padding: 10px; }
      label { font-size: 0.95rem; }
      .file-input { padding: 12px; font-size: 16px; }
      .submit-btn { padding: 16px; font-size: 1.05rem; }
      #progressMessage { font-size: 0.9rem; }
      /* Show a taller PDF area on phones */
      iframe { height: 70vh; }
      #pdfCanvasContainer { min-height: 60vh; }
      /* Larger tap targets for previews */
      .preview-image { border-width: 1px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Agent Form Assistant</h1>
    <p class="subtitle">An AI Agent that fills out forms for you, starting with Voter ID. This is just the beginning!</p>

    <div class="ai-banner">
      Fill Voter ID Form with AI Agent  
      <br>
      <small>This is a prototype for one form. In the future, every form can be auto-filled accurately!</small>
    </div>

    <form id="uploadForm" enctype="multipart/form-data">
      <div class="form-group">
        <label for="aadhaarFront">Aadhaar Front Image</label>
        <input type="file" id="aadhaarFront" name="aadhaarFront" accept="image/*" required class="file-input" onchange="previewImage(this, 'aadhaarFrontPreview')">
        <img id="aadhaarFrontPreview" class="preview-image" alt="Aadhaar Front Preview">
      </div>

      <div class="form-group">
        <label for="aadhaarBack">Aadhaar Back Image</label>
        <input type="file" id="aadhaarBack" name="aadhaarBack" accept="image/*" required class="file-input" onchange="previewImage(this, 'aadhaarBackPreview')">
        <img id="aadhaarBackPreview" class="preview-image" alt="Aadhaar Back Preview">
      </div>

      <button type="submit" class="submit-btn">Process Documents</button>
    </form>

    <div id="result"></div>

    <div id="progressContainer">
      <div><div id="progressBar"></div></div>
      <p id="progressMessage"></p>
    </div>

    <object id="pdfObject" type="application/pdf" data="" style="display:none; width:100%; height:80vh; border:none; border-radius:6px;"></object>
    <div id="pdfCanvasContainer" style="display:none; width:100%; margin-top:10px;"></div>
  </div>

  <script>
    function previewImage(input, previewId) {
      const preview = document.getElementById(previewId);
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function checkStatus() {
      try {
        const response = await fetch('/status');
        const data = await response.json();
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressMessage = document.getElementById('progressMessage');
        
        progressContainer.style.display = 'block';
        const pct = Math.max(0, Math.min(100, Number(data.progress) || 0));
        progressBar.style.width = `${pct}%`;
        progressBar.style.background = pct > 0 ? '#4caf50' : '#ddd';
        progressMessage.textContent = data.message;
        
        if (data.status === 'processing') {
          setTimeout(checkStatus, 1000);
        } else if (data.status === 'error') {
          progressContainer.style.display = 'none';
        }
      } catch (error) {
        console.error('Error checking status:', error);
      }
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const resultDiv = document.getElementById('result');
      const pdfObject = document.getElementById('pdfObject');
      const canvasContainer = document.getElementById('pdfCanvasContainer');
      const progressContainer = document.getElementById('progressContainer');

      async function renderPdfWithPdfJs(url) {
        try {
          if (!window['pdfjsLib']) return;
          const pdfjsLib = window['pdfjsLib'];
          // Worker and font data for reliable mobile rendering
          pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
          if (pdfjsLib.StandardFontDataFactory) {
            pdfjsLib.GlobalWorkerOptions.standardFontDataUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/';
          }
          const loadingTask = pdfjsLib.getDocument(url);
          const pdf = await loadingTask.promise;
          const page = await pdf.getPage(1);
          const containerWidth = canvasContainer.clientWidth || document.querySelector('.container').clientWidth || 500;
          const baseViewport = page.getViewport({ scale: 1 });
          const scale = Math.min(2, Math.max(0.8, containerWidth / baseViewport.width));
          const viewport = page.getViewport({ scale });
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          canvas.style.borderRadius = '6px';
          canvas.style.width = '100%';
          canvas.style.height = 'auto';
          canvasContainer.innerHTML = '';
          canvasContainer.appendChild(canvas);
          canvasContainer.style.display = 'block';
          await page.render({ canvasContext: context, viewport }).promise;
          // Scroll to canvas when rendered
          canvasContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) {
          console.error('PDF.js render error', e);
          // Fallback to native object/embed if canvas render fails
          const pdfObject = document.getElementById('pdfObject');
          pdfObject.style.display = 'block';
        }
      }
      
      try {
        progressContainer.style.display = 'block';
        checkStatus();
        
        const response = await fetch('/upload', {
          method: 'POST',
          body: formData
        });
        
        const data = await response.json();
        
        if (response.ok) {
          resultDiv.className = 'success';
          resultDiv.textContent = data.message;
          resultDiv.style.display = 'block';
          if (data.pdfUrl) {
            const url = `${data.pdfUrl}?ts=${Date.now()}`;
            // Set both object data and an embed fallback for better compatibility
            pdfObject.setAttribute('data', url);
            pdfObject.innerHTML = `<embed src="${url}" type="application/pdf" width="100%" height="500px" />`;
            pdfObject.style.display = 'block';
            // Hide progress bar once complete and scroll to the PDF
            progressContainer.style.display = 'none';
            pdfObject.scrollIntoView({ behavior: 'smooth', block: 'start' });
            // Additionally render via PDF.js canvas for maximum compatibility
            renderPdfWithPdfJs(url);
          }
        } else {
          resultDiv.className = 'error';
          resultDiv.textContent = data.error || 'An error occurred';
          resultDiv.style.display = 'block';
          pdfObject.style.display = 'none';
          canvasContainer.style.display = 'none';
        }
      } catch (error) {
        resultDiv.className = 'error';
        resultDiv.textContent = 'An error occurred while processing the request';
        resultDiv.style.display = 'block';
        pdfObject.style.display = 'none';
        canvasContainer.style.display = 'none';
      }
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>
</html>
